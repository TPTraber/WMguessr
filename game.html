<!DOCTYPE html>
<html lang="en">


<head>
    <!-- Page metadata, shared styles, and the interactive map library. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script src=" https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.min.js "></script>
</head>

<body>
    <!-- Panorama renderer, round timer, and map controls. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <div id="topBar">
        <div id="pointContainer">
            <p id="points">0</p>
        </div>
        <div id="timerContainer">
            <p id="timer">1:00</p>
        </div>
        <div id="roundContainer">
            <p id="rounds">0/5</p>
        </div>
    </div>

    <div id="roundSummaryContainer">
        <h2 id="summaryRound">Round 0</h2> 
        <h3>Distance: </h3>
        <p id="summaryDistance">500 M</p>
        <h3>Points Gained:</h3>
        <p id="summaryPoints">20</p>
    </div>

    <div id="mapContainer">
        <div id="map"></div>
        <button onclick="submitGuess()">Guess</button>
    </div>

    <div id="panoContainer"></div>

    <!-- Load scene and game behavior after the page elements. -->
    <script src="scripts/panorama.js"></script>
    <script src="scripts/map.js"></script>
    <script src="scripts/timer.js"></script>
    <script src="scripts/points.js"></script>
    <script src="scripts/rounds.js"></script>
    <script src="scripts/gameManager.js"></script>

</body>

</html>
